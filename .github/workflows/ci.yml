name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide whether main can skip tests
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types scripts/main-decision.ts

  test:
    needs: gate
    if: always() && (github.event_name == 'pull_request' || needs.gate.outputs.decision == 'run-tests') && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  extension:
    needs: [gate, test]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.decision == 'build-extension' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Choose the next patch
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(node -p "require('./browsers/chrome/public/manifest.json').version")
          tags=$(gh release list --limit 200 --json tagName --jq '[.[].tagName] | join(" ")')
          version=$(CURRENT="$current" TAGS="$tags" node --experimental-strip-types --input-type=module -e '
            import { nextFreeVersion } from "./src/lib/omnimod/mods.ts";
            const next = nextFreeVersion(process.env.CURRENT ?? "", (process.env.TAGS ?? "").split(/\s+/).filter(Boolean));
            if (!next) {
              console.error("Could not choose the next patch.");
              process.exit(1);
            }
            process.stdout.write(next);
          ')
          node -e '
            const fs = require("fs");
            const path = "browsers/chrome/public/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the Chrome extension
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:chrome
      - name: Pack the extension
        run: (cd dist/chrome && zip -r ../../omnimod-chrome.zip .)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          notes="Chrome extension ${version}."
          gh release create "$tag" omnimod-chrome.zip \
            --target "$GITHUB_SHA" \
            --title "OmniMod ${tag}" \
            --notes "$notes" \
            --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnimod-chrome
          path: omnimod-chrome.zip
