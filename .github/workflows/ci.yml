name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide whether main can skip tests
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types scripts/main-decision.ts

  test:
    needs: gate
    if: always() && (github.event_name == 'pull_request' || needs.gate.outputs.decision == 'run-tests') && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  extension:
    needs: [gate, test]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.decision == 'build-extension' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Chrome extension
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:chrome
      - name: Pack the extension
        run: (cd dist/chrome && zip -r ../../omnimod-chrome.zip .)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./browsers/chrome/public/manifest.json').version")
          tag="v${version}"
          notes="Chrome extension ${version} built from ${GITHUB_SHA}."
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" omnimod-chrome.zip \
            --target "$GITHUB_SHA" \
            --title "OmniMod ${tag}" \
            --notes "$notes" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: omnimod-chrome
          path: omnimod-chrome.zip
