name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/main-decision.js

  test:
    needs: gate
    # Run unless the gate explicitly said false. Empty/missing still runs.
    if: needs.gate.outputs.run_tests != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  extension:
    needs: [gate, test]
    # Build when the gate asked for it, and only after tests succeeded
    # (or were skipped because the gate said not to run them).
    if: always() && needs.gate.outputs.build == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:chrome
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
